{% extends 'simple.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{{ settings.HOSTNAME }}{% static 'css/fonts.hellix.css' %}" />
<link rel="stylesheet" href="{{ settings.HOSTNAME }}{% static 'css/login.css' %}" />
{% endblock %}

{% block content %}
<div class="login_page_new_ui gxu-login-page">
  <section class="left gxu-login-brand" aria-labelledby="gxu-platform-title">
    <img src="{{ settings.HOSTNAME }}{% static 'images/gxu-ai-platform-logo.svg' %}" class="gxu-login-logo" alt="广西大学 AI 智算团队" />
    <h1 id="gxu-platform-title"><span class="gxu-title-line">广西大学 AI 智算团队</span><span class="gxu-title-line">数据管理平台</span></h1>
    <p>数据标注与数据集管理平台</p>
  </section>
  <section class="right">
    {% block user_content %}{% endblock %}
  </section>
</div>
{% endblock %}
