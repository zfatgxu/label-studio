{% extends 'simple.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{{ settings.HOSTNAME }}{% static 'css/login.css' %}" />
{% endblock %}

{% block content %}
<div class="login_page gxu-login-page">
  <section class="gxu-login-brand" aria-labelledby="gxu-platform-title">
    <img src="{{ settings.HOSTNAME }}{% static 'images/gxu-ai-platform-logo.svg' %}" class="gxu-login-logo" alt="广西大学 AI 智算团队" />
    <div>
      <h1 id="gxu-platform-title"><span class="gxu-title-line">广西大学 AI 智算团队</span><span class="gxu-title-line">数据管理平台</span></h1>
      <p>数据标注与数据集管理平台</p>
    </div>
  </section>

  <div class="toggle" aria-label="账户操作">
    {% if not settings.DISABLE_SIGNUP_WITHOUT_LINK %}
      <a href="{{ settings.HOSTNAME }}/user/signup" class="{% if 'signup' in request.path %}active{% endif %}">注册</a>
      <a href="{{ settings.HOSTNAME }}/user/login" class="{% if 'login' in request.path %}active{% endif %}">登录</a>
    {% endif %}
  </div>

  {% block user_content %}{% endblock %}
</div>
{% endblock %}
